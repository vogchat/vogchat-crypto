name: Live site check

# Every day, confirm that https://vogchat.com/crypto.js is byte-for-byte src/crypto.js.
on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify-live
